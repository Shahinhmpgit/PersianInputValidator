
name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore tests/PersianInputValidator.Tests/PersianInputValidator.Tests.csproj

      - name: Build library
        run: dotnet build src/PersianInputValidator/PersianInputValidator.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/PersianInputValidator.Tests/PersianInputValidator.Tests.csproj --configuration Release
